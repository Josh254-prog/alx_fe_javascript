<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Quote Generator</title>
  <!-- Tailwind CSS CDN for modern styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom font for a more modern look */
    body {
      font-family: "Inter", sans-serif;
    }
  </style>
</head>
<body class="bg-gray-100 flex flex-col items-center justify-center min-h-screen p-4">
  <h1 class="text-4xl font-bold text-gray-800 mb-8 rounded-lg p-3 bg-white shadow-lg">Dynamic Quote Generator 💡</h1>

  <div id="filterSection" class="bg-white p-6 rounded-lg shadow-xl max-w-lg w-full mb-6">
    <h2 class="text-xl font-bold text-gray-800 mb-3">Filter Quotes by Category</h2>
    <select id="categoryFilter" onchange="filterQuotes()"
            class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white text-gray-700">
      <option value="all">All Categories</option>
      <!-- Categories will be populated dynamically here -->
    </select>
  </div>

  <div id="quoteDisplay" class="bg-white p-8 rounded-lg shadow-xl text-center max-w-lg w-full mb-6">
    <p id="quoteText" class="text-2xl italic text-gray-700 mb-4"></p>
    <p id="quoteCategory" class="text-lg font-semibold text-blue-600"></p>
    <p id="lastViewedQuoteInfo" class="text-sm text-gray-500 mt-2"></p>
  </div>

  <div id="syncStatus" class="text-sm text-gray-600 mb-4 bg-yellow-100 p-2 rounded-md hidden"></div>


  <div class="flex space-x-4 mb-8">
    <button id="newQuote" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg shadow-md transition duration-300 ease-in-out transform hover:scale-105 focus:outline-none focus:ring-4 focus:ring-blue-300">
      Show New Quote
    </button>
    <button id="exportQuotes" class="bg-purple-500 hover:bg-purple-700 text-white font-bold py-3 px-6 rounded-lg shadow-md transition duration-300 ease-in-out transform hover:scale-105 focus:outline-none focus:ring-4 focus:ring-purple-300">
      Export Quotes (JSON)
    </button>
    <button id="syncNowButton" class="bg-gray-700 hover:bg-gray-900 text-white font-bold py-3 px-6 rounded-lg shadow-md transition duration-300 ease-in-out transform hover:scale-105 focus:outline-none focus:ring-4 focus:ring-gray-500">
      Sync Now
    </button>
  </div>

  <div id="addQuoteSection" class="bg-white p-8 rounded-lg shadow-xl max-w-lg w-full mb-6">
    <h2 class="text-2xl font-bold text-gray-800 mb-4">Add a New Quote</h2>
    <div class="space-y-4">
      <input id="newQuoteText" type="text" placeholder="Enter a new quote"
             class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400" />
      <input id="newQuoteCategory" type="text" placeholder="Enter quote category"
             class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400" />
      <button onclick="addQuote()" class="w-full bg-green-500 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg shadow-md transition duration-300 ease-in-out transform hover:scale-105 focus:outline-none focus:ring-4 focus:ring-green-300">
        Add Quote
      </button>
    </div>
  </div>

  <div id="importSection" class="bg-white p-8 rounded-lg shadow-xl max-w-lg w-full">
    <h2 class="text-2xl font-bold text-gray-800 mb-4">Import Quotes</h2>
    <p class="text-gray-700 mb-4">Select a JSON file to import quotes:</p>
    <input type="file" id="importFile" accept=".json" onchange="importFromJsonFile(event)"
           class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"/>
  </div>

  <script src="script.js"></script>
</body>
</html>
